<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Tile Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <path d="M12 48 H52 M12 36 H52 M12 24 H52" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2 2" />

  <!-- Candlestick Bar 1 -->
  <line x1="20" y1="32" x2="20" y2="44" stroke="#93c5fd" stroke-width="1.5" opacity="0.6"/>
  <rect x="18" y="34" width="4" height="7" rx="1" fill="#93c5fd" opacity="0.8"/>

  <!-- Candlestick Bar 2 -->
  <line x1="28" y1="26" x2="28" y2="40" stroke="#6ee7b7" stroke-width="1.5" opacity="0.7"/>
  <rect x="26" y="28" width="4" height="9" rx="1" fill="#10b981" opacity="0.9"/>

  <!-- Candlestick Bar 3 (Breakout) -->
  <line x1="36" y1="18" x2="36" y2="35" stroke="#34d399" stroke-width="1.5"/>
  <rect x="34" y="20" width="4" height="11" rx="1" fill="#34d399"/>

  <!-- Lightning Signal Arrow Breakout -->
  <path d="M16 42 L28 30 L38 34 L50 16" stroke="url(#glowGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Arrow Head -->
  <path d="M43 16 H50 V23" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Signal Pulse Dot -->
  <circle cx="50" cy="16" r="3" fill="#ffffff" filter="url(#glow)" />
</svg>